name: Sync Strava

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Sync Strava
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          LOG_LEVEL: INFO
        run: python -m training_pipeline.cli sync --source strava

      # The workflow is disabled while Strava's API is subscriber-only, so this
      # normally never fires. It is wired up anyway so that re-enabling the
      # workflow does not also mean remembering to re-add the alerting.
      - uses: ./.github/actions/report-failure
        if: always()
        with:
          component: Strava sync
          outcome: ${{ job.status }}
          token: ${{ secrets.GITHUB_TOKEN }}
          recovery: |
            Strava's API has been subscriber-only since mid-2026. Without an
            active subscription the app is deactivated and every activity call
            returns `403` (`Application/Status/Inactive`) — token refresh still
            returns 200, so a working refresh is not evidence the sync works,
            and re-authorising does not help. Garmin is the primary activity
            source; this workflow stays disabled until a subscription is active.
