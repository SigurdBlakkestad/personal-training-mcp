name: Compute Derived Metrics

# Manual only. The routine daily compute runs as a dependent step inside
# sync_garmin.yml, so it can never churn over stale data after a failed sync.
# This workflow is for ad-hoc backfills and investigations.
on:
  workflow_dispatch:
    inputs:
      recompute_load:
        description: Force recompute of training_load for the last 60 days, even where a value already exists
        required: false
        default: false
        type: boolean

concurrency:
  group: compute-derived
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: Compute derived metrics
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ATHLETE_FTP: ${{ secrets.ATHLETE_FTP }}
          ATHLETE_HR_REST: ${{ vars.ATHLETE_HR_REST }}
          ATHLETE_HR_MAX: ${{ vars.ATHLETE_HR_MAX }}
          LOG_LEVEL: INFO
        run: python -m training_pipeline.cli compute-derived ${{ github.event.inputs.recompute_load == 'true' && '--recompute-load' || '' }}

      - uses: ./.github/actions/report-failure
        if: always()
        with:
          component: Derived metrics
          outcome: ${{ job.status }}
          token: ${{ secrets.GITHUB_TOKEN }}
          recovery: |
            CTL/ATL/TSB stop moving while this is red, so readiness advice goes
            stale without looking wrong. Usually a DB or schema problem rather
            than a credential — check `DATABASE_URL` and whether a migration is
            pending (`alembic current` vs `alembic heads`).
