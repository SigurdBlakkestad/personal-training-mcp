[project]
name = "training-pipeline"
version = "0.1.0"
description = "Personal training data pipeline: Strava/Withings/Garmin → Postgres → Claude/Notion/iPhone"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "psycopg[binary]>=3.2",
    # 2.1 types Row indexing per column; keep local and fresh envs on the same
    # typing so mypy agrees everywhere.
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "tenacity>=9.0",
    "mcp[cli]>=1.0",
    "fastmcp>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "notion-client>=2.2,<2.6",
    "ics>=0.7",
    # Floor bumped to the known-good version — older releases fail Garmin's SSO
    # with "Failed to retrieve social profile". Keep this current when Garmin
    # changes their auth (roughly yearly); it pulls a compatible `garth`.
    "garminconnect>=0.3.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # Exact pins: lint/type results change between releases, so every env
    # must run the same checker versions.
    "ruff==0.16.9",
    "mypy==2.3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["training_pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# garminconnect ships no type information.
[[tool.mypy.overrides]]
module = ["garminconnect", "garminconnect.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
