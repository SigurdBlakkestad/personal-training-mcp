name: Publish Calendar

on:
  # Standalone backstop so the calendar still refreshes daily even if the
  # Notion Mirror workflow (the workflow_run trigger below) is ever disabled.
  schedule:
    - cron: "45 6 * * *"
  workflow_run:
    workflows: ["Notion Mirror"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/training_pipeline/calendar_publish/**"
      - ".github/workflows/publish_calendar.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Regenerate training.ics
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LOG_LEVEL: INFO
        run: python -m training_pipeline.cli publish-calendar

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/training.ics
          if git diff --staged --quiet; then
            echo "No calendar changes to commit."
            exit 0
          fi
          git commit -m "chore: update training.ics"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt rejected; rebasing on origin/main and retrying."
            git pull --rebase origin main
          done
          echo "Push failed after 5 attempts."
          exit 1
