name: Sync Garmin

on:
  schedule:
    - cron: "45 5 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    # No continue-on-error: Garmin is its own workflow, so a red run here never
    # blocks Strava/Withings/derived (those run on their own schedules). Failing
    # loud is deliberate — a silent "success" once hid a 4-month token outage.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Sync Garmin
        id: sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GARMINTOKENS_B64: ${{ secrets.GARMINTOKENS_B64 }}
          LOG_LEVEL: INFO
        run: python -m training_pipeline.cli sync --source garmin

      - name: Summarize result
        if: always()
        run: |
          if [ "${{ steps.sync.outcome }}" = "success" ]; then
            echo "Garmin sync: success" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Garmin sync: FAILED — stored token rejected, or the library needs a bump" >> "$GITHUB_STEP_SUMMARY"
            echo "Recovery: see OPERATIONS.md 'Garmin workflow failing'. Re-running scripts/garmin_auth.py is not enough on its own — the rejected service_credentials row has to be cleared so the new secret is used as the seed." >> "$GITHUB_STEP_SUMMARY"
          fi

      # A red run is only useful if someone sees it. The 2026-09-17 token
      # rejection sat unnoticed for six days because nothing spoke up. One open
      # issue per outage — GitHub's own notifications do the delivery, so this
      # needs no new secret.
      - name: Report failure
        if: always()
        uses: actions/github-script@v7
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        with:
          script: |
            const LABEL = 'sync-failure';
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL,
            });
            const runUrl =
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            if (process.env.SYNC_OUTCOME === 'success') {
              // Close on recovery, otherwise a stale issue silences the next outage.
              for (const issue of open.data) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `Recovered — [sync succeeded](${runUrl}).`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number, state: 'closed',
                });
              }
              return;
            }

            if (open.data.length > 0) {
              core.info(`#${open.data[0].number} already open; not filing another.`);
              return;
            }

            await github.rest.issues.createLabel({
              owner, repo, name: LABEL, color: 'b60205',
              description: 'An ingestion workflow is failing',
            }).catch(() => {});  // already exists

            await github.rest.issues.create({
              owner, repo,
              labels: [LABEL],
              title: 'Garmin sync is failing',
              body: [
                `The Garmin sync failed: [run log](${runUrl}).`,
                '',
                'Read the chained cause in the traceback before assuming a dead token:',
                '`API Error 401` means the stored token was rejected, whereas a stale',
                '`garminconnect` fails earlier in the SSO flow. "Failed to retrieve social',
                'profile" on its own says nothing — it wraps both.',
                '',
                'Recovery: OPERATIONS.md, "Garmin workflow failing". Re-running',
                '`scripts/garmin_auth.py` is not enough on its own — the rejected',
                '`service_credentials` row has to be deleted so the new secret is used as',
                'the seed.',
                '',
                'This issue closes itself when a run succeeds.',
              ].join('\n'),
            });
