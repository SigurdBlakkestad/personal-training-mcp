services:
  - type: web
    name: personal-training-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn training_pipeline.mcp_server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PYTHONPATH
        value: src
      - key: DATABASE_URL
        sync: false
      - key: MCP_GITHUB_CLIENT_ID
        sync: false
      - key: MCP_GITHUB_CLIENT_SECRET
        sync: false
      - key: MCP_PUBLIC_URL
        sync: false
      - key: MCP_ALLOWED_GITHUB_LOGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: ATHLETE_FTP
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DB_PLAN_ID
        sync: false
      - key: NOTION_DB_ACTIVITIES_ID
        sync: false
      - key: NOTION_DB_METRICS_ID
        sync: false
