name: Publish Calendar

on:
  workflow_run:
    workflows: ["Notion Mirror"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/training_pipeline/calendar_publish/**"
      - ".github/workflows/publish_calendar.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Regenerate training.ics
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LOG_LEVEL: INFO
        run: python -m training_pipeline.cli publish-calendar

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/training.ics
          if git diff --staged --quiet; then
            echo "No calendar changes to commit."
          else
            git commit -m "chore: update training.ics"
            git push
          fi
