name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # No secrets: tests/conftest.py gives Settings a dummy DATABASE_URL, and
      # all tests mock HTTP and DB access.
      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Typecheck
        run: mypy src/

      - name: Test
        run: pytest
