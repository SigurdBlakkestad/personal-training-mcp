name: Compute Derived Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Compute derived metrics
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ATHLETE_FTP: ${{ secrets.ATHLETE_FTP }}
          LOG_LEVEL: INFO
        run: python -m training_pipeline.cli compute-derived
