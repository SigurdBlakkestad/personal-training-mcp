name: Notion Mirror

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

concurrency:
  group: notion-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    # Backstop; the step timeout below fails loud (see sync_garmin.yml).
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: Mirror to Notion
        timeout-minutes: 20
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ACTIVITIES_ID: ${{ secrets.NOTION_DB_ACTIVITIES_ID }}
          NOTION_DB_PLAN_ID: ${{ secrets.NOTION_DB_PLAN_ID }}
          NOTION_DB_METRICS_ID: ${{ secrets.NOTION_DB_METRICS_ID }}
          LOG_LEVEL: INFO
        run: python -m training_pipeline.cli notion-mirror

      - uses: ./.github/actions/report-failure
        if: always()
        with:
          component: Notion mirror
          outcome: ${{ job.status }}
          token: ${{ secrets.GITHUB_TOKEN }}
          recovery: |
            Postgres stays correct while this is red — only the readable Notion
            views go stale. Common causes: a 429 rate limit (see OPERATIONS.md),
            a revoked `NOTION_TOKEN`, or a database the integration lost access
            to after being moved in Notion.
