name: Sync Withings

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Sync Withings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WITHINGS_CLIENT_ID: ${{ secrets.WITHINGS_CLIENT_ID }}
          WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
          WITHINGS_ACCESS_TOKEN: ${{ secrets.WITHINGS_ACCESS_TOKEN }}
          WITHINGS_REFRESH_TOKEN: ${{ secrets.WITHINGS_REFRESH_TOKEN }}
          WITHINGS_USERID: ${{ secrets.WITHINGS_USERID }}
          LOG_LEVEL: INFO
        run: python -m training_pipeline.cli sync --source withings

      - uses: ./.github/actions/report-failure
        if: always()
        with:
          component: Withings sync
          outcome: ${{ job.status }}
          token: ${{ secrets.GITHUB_TOKEN }}
          recovery: |
            Usually a revoked or expired refresh token. The live token is the
            `withings` row in `service_credentials`: re-bootstrap with
            `python scripts/withings_auth.py`, update the
            `WITHINGS_REFRESH_TOKEN` secret, and delete that row. See
            OPERATIONS.md.
