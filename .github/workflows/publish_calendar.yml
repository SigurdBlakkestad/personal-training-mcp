name: Publish Calendar

on:
  # Standalone backstop so the calendar still refreshes daily even if the
  # Notion Mirror workflow (the workflow_run trigger below) is ever disabled.
  schedule:
    - cron: "45 6 * * *"
  workflow_run:
    workflows: ["Notion Mirror"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/training_pipeline/calendar_publish/**"
      - ".github/workflows/publish_calendar.yml"

# The cron backstop and the workflow_run trigger usually both fire each
# morning; queue them so they don't race each other's push.
concurrency:
  group: calendar-publish
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  publish:
    # workflow_run fires on every Notion Mirror completion, failed ones
    # included; only follow a successful mirror. The cron backstop still runs.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e .

      - name: Regenerate training.ics
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LOG_LEVEL: INFO
        run: python -m training_pipeline.cli publish-calendar

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/training.ics
          if git diff --staged --quiet; then
            echo "No calendar changes to commit."
            exit 0
          fi
          git commit -m "chore: update training.ics"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt rejected; rebasing on origin/main and retrying."
            git pull --rebase origin main
          done
          echo "Push failed after 5 attempts."
          exit 1

      - uses: ./.github/actions/report-failure
        if: always()
        with:
          component: Calendar publish
          outcome: ${{ job.status }}
          token: ${{ secrets.GITHUB_TOKEN }}
          recovery: |
            The iPhone calendar feed stops updating, so the phone quietly shows
            an old plan. Either `publish-calendar` failed to regenerate
            `docs/training.ics`, or the commit lost the push race five times in
            a row — the run log says which.
